name: Release Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"

      - name: Set up MSVC dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build, package, and create installer
        shell: cmd
        run: |
          call build_installer.bat

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: CrossTerm-windows-package
          path: |
            dist/windows/bin/**
            dist/windows/CrossTerm-windows-x64.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CrossTerm-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "linux"
          target: "desktop"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential ninja-build

      - name: Build and package
        run: bash build_linux.sh

      - name: Create versioned tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="dev"
          fi
          PKG_NAME="CrossTerm-${VERSION}-linux-x86_64"
          mkdir -p "/tmp/$PKG_NAME"
          cp -r dist/linux/* "/tmp/$PKG_NAME/"
          mkdir -p dist/archives
          tar -czf "dist/archives/${PKG_NAME}.tar.gz" -C /tmp "$PKG_NAME"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: CrossTerm-linux-package
          path: dist/archives/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches project version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION=$(sed -nE 's/^project\(CrossTerm VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          ISS_VERSION=$(sed -nE 's/^#define MyAppVersion "([^"]+)"/\1/p' installer/CrossTerm.iss)
          echo "Tag: $VERSION  CMakeLists.txt: $CMAKE_VERSION  CrossTerm.iss: $ISS_VERSION"
          if [ "$VERSION" != "$CMAKE_VERSION" ] || [ "$VERSION" != "$ISS_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version; bump the version before tagging."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir release
          cp artifacts/CrossTerm-linux-package/*.tar.gz release/
          cp artifacts/CrossTerm-windows-installer/*.exe release/
          cp artifacts/CrossTerm-windows-package/CrossTerm-windows-x64.zip \
             "release/CrossTerm-${VERSION}-windows-x64.zip"
          ls -l release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --latest
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "CrossTerm ${VERSION}" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
